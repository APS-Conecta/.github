name: Dev task / bug
description: Technical task or bug for the developers (references epics/stories/ADRs; assumes fluency with this repository's own gate).
title: "[dev]: "
body:
  - type: dropdown
    id: type
    attributes:
      label: Type
      options:
        - feature
        - bug
        - refactor
        - chore
        - test
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What needs to happen, technically.
    validations:
      required: true
  - type: input
    id: refs
    attributes:
      label: References
      description: Related epic / story / ADR. Name the repository if the ADR is not in this one.
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce (bugs only)
      description: Exact commands + expected vs actual. Say where each runs (host / which container / which user).
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How we'll know it's done (Given/When/Then welcome). Name the gate that proves it, green.
    validations:
      required: true
