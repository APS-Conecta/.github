# actionlint 1.7.12 predates the documented job.workflow_* context, which app-release.yml and
# style-check.yml read.
paths:
  .github/workflows/app-release.yml:
    ignore:
      - 'property "workflow_(repository|sha|ref)" is not defined'
  .github/workflows/style-check.yml:
    ignore:
      - 'property "workflow_(repository|sha)" is not defined'
